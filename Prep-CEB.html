<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Préparation au CEB</title>
<style>
  :root {
    --bg: #eef3f9; --card: #fff; --ink: #1f2933; --muted: #5f6b76; --line: #d7dee7;
    --accent: #2f6fd1; --accent-dark: #2559aa; --ok: #2f9e55; --ok-bg: #e6f5ea; --bad: #d64545; --bad-bg: #fde8e8;
    --warn: #e07b16; --warn-bg: #fff1e3; --gold: #7a3f00;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); min-height: 100vh; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
  header .brand { font-weight: 800; font-size: 19px; cursor: pointer; }
  header .crumbs { color: var(--muted); font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; font-size: 15px; border-radius: 9px; border: 1px solid #c8d0da; background: #fff; padding: 8px 14px; cursor: pointer; color: var(--ink); }
  button:hover { background: #f2f6fb; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent-dark); }
  main { max-width: 900px; margin: 0 auto; padding: 20px 14px 50px; }
  h2 { margin: 6px 0 4px; font-size: 24px; }
  .lead { color: var(--muted); margin: 0 0 18px; }

  /* accueil */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .subject { background: var(--card); border-radius: 14px; padding: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.06); cursor: pointer; border: 2px solid transparent; text-decoration: none; color: inherit; display: block; }
  .sechead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 26px 0 8px; border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
  .sechead h3 { margin: 0; font-size: 20px; }
  .sechead span { color: var(--muted); font-size: 14px; }
  .sechead button { margin-left: auto; }
  .subject:hover { border-color: var(--accent); }
  .subject h3 { margin: 0 0 6px; font-size: 19px; }
  .subject p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .subject .meta { margin-top: 10px; font-size: 13px; color: var(--accent); font-weight: 600; }

  /* liste des thèmes */
  .theme { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.05); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .theme .t { flex: 1 1 260px; }
  .theme .t b { font-size: 17px; }
  .theme .t div { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .bar { height: 8px; background: #e4e9f0; border-radius: 5px; overflow: hidden; margin-top: 7px; max-width: 320px; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .theme .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .mixall { margin: 4px 0 16px; }

  /* question */
  .qbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 15px; }
  .qbar .pills span { display: inline-block; margin-left: 10px; font-weight: 700; }
  .qbar .pills .g { color: var(--ok); } .qbar .pills .o { color: var(--warn); } .qbar .pills .b { color: var(--accent); }
  .card { background: var(--card); border-radius: 16px; box-shadow: 0 4px 18px rgba(0,0,0,.08); padding: 24px; max-width: 680px; margin: 0 auto; }
  .prompt { font-size: 21px; text-align: center; margin-bottom: 18px; line-height: 1.4; }
  .prompt b { color: var(--gold); }
  .prompt .again { font-size: 14px; color: var(--warn); margin-top: 6px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opts.long { grid-template-columns: 1fr; }
  @media (max-width: 560px) { .opts { grid-template-columns: 1fr; } }
  .opts button { font-size: 17px; padding: 13px 12px; border-radius: 10px; border: 2px solid #c8d0da; text-align: left; line-height: 1.35; }
  .opts button .k { display: inline-block; min-width: 18px; font-size: 12px; color: var(--muted); }
  .opts button.right { background: var(--ok-bg); border-color: var(--ok); color: #155c2c; font-weight: 700; }
  .opts button.wrong { background: var(--bad-bg); border-color: var(--bad); color: #8a1f1f; text-decoration: line-through; }
  .opts button.dim { opacity: .5; }
  .opts button:disabled { cursor: default; }
  .learn { margin-top: 16px; font-size: 16px; line-height: 1.5; padding: 12px 14px; border-radius: 10px; }
  .learn.ok { background: var(--ok-bg); border-left: 5px solid var(--ok); }
  .learn.bad { background: var(--warn-bg); border-left: 5px solid var(--warn); }
  .learn .small { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .inrow { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .inrow input { font: inherit; font-size: 22px; padding: 10px 14px; border: 2px solid #c8d0da; border-radius: 10px; width: 220px; text-align: center; }
  .inrow .unit { font-size: 20px; font-weight: 700; }
  .hint2 { text-align: center; color: var(--muted); font-size: 13px; margin-top: 8px; }
  .prompt .calc { display: inline-block; font-size: 26px; font-weight: 700; margin-top: 6px; color: var(--ink); }
  .prompt .tag { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; background: #5f6b76; border-radius: 6px; padding: 2px 7px; margin-bottom: 6px; }
  .prompt .tag.calcok { background: #2f6fd1; }
  .prompt .text { text-align: left; font-size: 16px; background: #f7f9fc; border: 1px solid #e1e6ee; border-radius: 10px; padding: 12px 14px; margin: 8px 0 12px; line-height: 1.55; }
  .next { display: block; margin: 16px auto 0; font-size: 18px; padding: 10px 28px; }

  /* schéma */
  .diagram { width: 100%; max-width: 620px; display: block; margin: 0 auto; }
  .diagram .r { stroke: #7d6a5a; stroke-width: 1.5; cursor: pointer; transition: fill .15s; }
  .diagram .r:hover { filter: brightness(1.08); }
  .diagram .r.right { fill: #7fd39a !important; }
  .diagram .r.wrong { fill: #f08d8d !important; }
  .diagram .r.target { animation: pulse .9s ease-in-out infinite; }
  @keyframes pulse { 50% { fill: #ffd34d; } }
  .diagram text { font-size: 15px; font-weight: 700; fill: #1f2933; paint-order: stroke; stroke: #fff; stroke-width: 4px; pointer-events: none; }
  .diagram .deco { fill: none; stroke: #9c8775; stroke-width: 1.2; opacity: .55; pointer-events: none; }

  /* fiches */
  table.tbl { margin: 8px auto; border-collapse: collapse; background: #fff; font-size: 15px; }
  table.tbl td { border: 1px solid #c9d1db; padding: 5px 10px; text-align: center; }
  table.tbl td:first-child { background: #f4f7fb; font-weight: 700; }
  table.sheet { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.05); }
  table.sheet td { padding: 9px 12px; border-bottom: 1px solid #edf0f4; vertical-align: top; font-size: 15px; line-height: 1.4; }
  table.sheet td:first-child { font-weight: 700; white-space: nowrap; width: 1%; }
  table.sheet tr.grp td { background: #f4f7fb; font-weight: 700; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .03em; }
  .sheetq { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.05); font-size: 15px; line-height: 1.45; }
  .sheetq .a { color: #155c2c; font-weight: 700; }
  .sheetq .x { color: var(--muted); font-size: 14px; }
  .note { background: #fffbea; border: 1px solid #efe3b5; border-radius: 10px; padding: 10px 14px; margin: 0 0 14px; font-size: 15px; }

  /* fin de manche */
  .end .big { font-size: 42px; font-weight: 800; color: var(--accent); }
  .end ul { padding-left: 18px; line-height: 1.5; }
  .end .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
</style>
</head>
<body>
<header>
  <span class="brand" id="home">Préparation au CEB</span>
  <span class="crumbs" id="crumbs"></span>
  <button id="back" hidden>← Retour</button>
</header>
<main id="app"></main>

<script>// Outils communs aux exercices générés.
window.GEN = window.GEN || {};
window.GROUP_EXTRA = window.GROUP_EXTRA || {};
window.U = (function () {
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const r6 = x => Math.round(x * 1e6) / 1e6;
  // nombre -> texte « à la française » : virgule décimale, espaces pour les milliers
  function fmt(x) {
    x = r6(x);
    const neg = x < 0; x = Math.abs(x);
    let [ent, dec] = String(x).split(".");
    if (String(x).includes("e")) { ent = x.toFixed(0); dec = ""; }
    ent = ent.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "−" : "") + ent + (dec ? "," + dec : "");
  }
  // nombres en lettres, à la belge (septante, nonante)
  const UN = ["zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize"];
  const DIZ = { 2: "vingt", 3: "trente", 4: "quarante", 5: "cinquante", 6: "soixante", 7: "septante", 8: "quatre-vingt", 9: "nonante" };
  function moins100(n, final) {
    if (n < 17) return UN[n];
    if (n < 20) return "dix-" + UN[n - 10];
    const t = Math.floor(n / 10), u = n % 10;
    if (t === 8) return u === 0 ? (final ? "quatre-vingts" : "quatre-vingt") : "quatre-vingt-" + UN[u];
    if (u === 0) return DIZ[t];
    if (u === 1) return DIZ[t] + " et un";
    return DIZ[t] + "-" + UN[u];
  }
  function moins1000(n, final) {
    const h = Math.floor(n / 100), r = n % 100;
    let out = "";
    if (h === 1) out = "cent";
    else if (h > 1) out = UN[h] + " cent" + (r === 0 && final ? "s" : "");
    if (r) out += (out ? " " : "") + moins100(r, final);
    return out;
  }
  function lettres(n) {
    if (n === 0) return "zéro";
    const mi = Math.floor(n / 1e6), k = Math.floor((n % 1e6) / 1000), r = n % 1000;
    const parts = [];
    if (mi) parts.push(mi === 1 ? "un million" : moins1000(mi, true) + " millions");
    if (k) parts.push(k === 1 ? "mille" : moins1000(k, false) + " mille");
    if (r) parts.push(moins1000(r, true));
    return parts.join(" ");
  }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
  const fr = (a, b) => a + "/" + b;
  function simp(a, b) { const g = gcd(a, b); return [a / g, b / g]; }
  // question à réponse tapée (nombre)
  const num = (prompt, value, learn, extra) => Object.assign({ kind: "input", prompt, num: r6(value), answerText: fmt(value), learn }, extra || {});
  // question à réponse tapée (fraction)
  const frac = (prompt, a, b, learn, extra) => { const [x, y] = simp(a, b); return Object.assign({ kind: "input", prompt, frac: [a, b], answerText: y === 1 ? String(x) : x + "/" + y, learn }, extra || {}); };
  // question à choix : la première option est la bonne (le moteur mélange)
  const qcm = (prompt, options, learn, extra) => Object.assign({ kind: "qcm", prompt, options, learn, answerText: options[0] }, extra || {});
  const SANS = "<span class='tag'>Sans calculatrice</span><br>";
  const AVEC = "<span class='tag calcok'>Calculatrice permise</span><br>";
  return { rnd, pick, shuffle, r6, fmt, lettres, gcd, fr, simp, num, frac, qcm, SANS, AVEC };
})();

// FRANÇAIS — selon les balises CEB 2026 et la nouvelle terminologie du référentiel :
// groupe sujet / groupe prédicat / groupe complément circonstanciel de phrase (CCP) ; « classes de mots » ;
// « connecteur » (prépositions et conjonctions) ; 5 modes ; composition et dérivation ;
// fait et opinion ; 5 structures de textes.
(function () {
  const { rnd, pick, shuffle, qcm } = window.U;
  const G = window.GEN;

  // ---------------------------------------------------------------- LES GROUPES DE LA PHRASE
  // segments : [texte, rôle] ; S = groupe sujet, P = groupe prédicat, C = groupe complément circonstanciel de phrase (CCP)
  // d : un piège (un groupe qui n'est PAS celui demandé, mais qu'on confond souvent)
  const PHRASES = [
    { s: [["Chaque matin,", "C"], ["mon grand frère", "S"], ["promène le chien du voisin", "P"]], d: "le chien du voisin" },
    { s: [["Les élèves de 6e", "S"], ["préparent une exposition", "P"], ["depuis septembre", "C"]], d: "une exposition" },
    { s: [["Dans la forêt,", "C"], ["un vieux loup", "S"], ["cherchait sa nourriture", "P"]], d: "sa nourriture" },
    { s: [["Le ciel", "S"], ["était couvert de nuages", "P"]], d: "de nuages" },
    { s: [["Pendant les vacances,", "C"], ["ma cousine et moi", "S"], ["avons visité le château de Bouillon", "P"]], d: "le château de Bouillon" },
    { s: [["Le chat de ma voisine", "S"], ["dort", "P"]], d: "ma voisine" },
    { s: [["Hier soir,", "C"], ["il", "S"], ["a raconté une histoire à ses enfants", "P"]], d: "ses enfants" },
    { s: [["Les feuilles", "S"], ["tombent", "P"], ["en automne", "C"]], d: "Les feuilles tombent" },
    { s: [["Le directeur de l'école", "S"], ["semble fatigué", "P"], ["aujourd'hui", "C"]], d: "l'école" },
    { s: [["Sous le pont", "C"], ["coule", "P"], ["une rivière tranquille", "S"]], d: "le pont" },
    { s: [["Mes parents", "S"], ["m'ont offert un vélo", "P"], ["pour mon anniversaire", "C"]], d: "un vélo" },
    { s: [["Le match de football", "S"], ["commencera", "P"], ["à 15 heures", "C"]], d: "football" },
    { s: [["Les abeilles", "S"], ["fabriquent du miel", "P"]], d: "du miel" },
    { s: [["Au loin,", "C"], ["on", "S"], ["entendait des cris", "P"]], d: "des cris" },
    { s: [["Quand la cloche a sonné,", "C"], ["les enfants", "S"], ["sont rentrés en classe", "P"]], d: "la cloche" },
    { s: [["Dans ce village", "C"], ["vivait", "P"], ["une sorcière très gentille", "S"]], d: "ce village" },
    { s: [["Le soir,", "C"], ["les étoiles", "S"], ["apparaissent", "P"]], d: "Le soir, les étoiles" },
    { s: [["Mon petit frère", "S"], ["a cassé le vase de grand-mère", "P"]], d: "le vase de grand-mère" },
    { s: [["Grâce à son courage,", "C"], ["le pompier", "S"], ["a sauvé trois enfants", "P"]], d: "trois enfants" },
    { s: [["Dans la cour de récréation,", "C"], ["les élèves de cinquième", "S"], ["jouent au ballon", "P"]], d: "la cour de récréation" },
    { s: [["Ma tante qui habite à Liège", "S"], ["nous rend visite", "P"], ["chaque été", "C"]], d: "Liège" },
    { s: [["Demain,", "C"], ["nous", "S"], ["irons au musée des sciences naturelles", "P"]], d: "au musée des sciences naturelles" },
    { s: [["Le gardien de but", "S"], ["a arrêté le penalty", "P"], ["à la dernière minute", "C"]], d: "le penalty" },
    { s: [["Cette histoire", "S"], ["paraît incroyable", "P"]], d: "incroyable" },
    { s: [["Lentement,", "C"], ["la tortue", "S"], ["traversa la route", "P"]], d: "la route" },
    { s: [["Au fond du jardin", "C"], ["poussent", "P"], ["de magnifiques tournesols", "S"]], d: "du jardin" },
    { s: [["Mes voisins et leurs enfants", "S"], ["partent en vacances", "P"], ["en juillet", "C"]], d: "leurs enfants" },
    { s: [["Pour réussir son examen,", "C"], ["Julie", "S"], ["révise ses leçons", "P"]], d: "ses leçons" }
  ];
  const ROLE = { S: "groupe sujet", P: "groupe prédicat", C: "groupe complément circonstanciel de phrase (CCP)" };
  G.groupes = function (i) {
    const ph = PHRASES[i % PHRASES.length];
    const roles = ph.s.map(x => x[1]);
    const r = pick(roles);
    const good = ph.s.find(x => x[1] === r)[0].replace(/,$/, "");
    const others = ph.s.filter(x => x[1] !== r).map(x => x[0].replace(/,$/, ""));
    const phrase = ph.s.map(x => x[0]).join(" ").replace(/^./, c => c.toUpperCase()) + ".";
    const tips = { S: "Le groupe sujet peut être encadré par « c'est… qui » et il commande l'accord du verbe.", P: "Le groupe prédicat dit ce qu'on dit du sujet : il contient le verbe conjugué et ce qui en dépend. On ne peut pas le supprimer.", C: "Le groupe complément circonstanciel de phrase (CCP) peut être déplacé et supprimé : la phrase reste correcte." };
    return qcm("Dans la phrase :<div class='text'>" + phrase + "</div>Quel est le <b>" + ROLE[r] + "</b> ?", [good].concat(others, [ph.d]).slice(0, 4),
      "Réponse : « <b>" + good + "</b> ». " + tips[r], { long: true });
  };

  // ---------------------------------------------------------------- CLASSES DE MOTS
  const CLASSES = ["nom", "déterminant", "adjectif", "pronom", "verbe", "adverbe", "connecteur"];
  // [phrase avec le mot entre *étoiles*, classe, confusion fréquente, explication]
  const MOTS = [
    ["Je *le* vois souvent.", "pronom", "déterminant", "« le » remplace un nom (il est devant un verbe) : c'est un pronom."],
    ["*Le* chien aboie.", "déterminant", "pronom", "« le » est devant un nom : c'est un déterminant."],
    ["Elle chante *bien*.", "adverbe", "adjectif", "« bien » précise le verbe et ne s'accorde pas : adverbe."],
    ["Il marche *vite*.", "adverbe", "adjectif", "« vite » précise la façon de marcher et est invariable : adverbe."],
    ["Une voiture *rapide* passe.", "adjectif", "adverbe", "« rapide » précise le nom « voiture » et s'accorde (des voitures rapides) : adjectif."],
    ["Je *leur* parle.", "pronom", "déterminant", "« leur » devant un verbe remplace « à eux » : pronom (invariable)."],
    ["*Leurs* cartables sont lourds.", "déterminant", "pronom", "« leurs » devant un nom : déterminant (il s'accorde)."],
    ["Le livre est *sur* la table.", "connecteur", "adverbe", "« sur » relie des mots (c'est une préposition) : dans la nouvelle terminologie, c'est un connecteur."],
    ["Il pleut, *mais* nous sortons.", "connecteur", "adverbe", "« mais » relie deux parties de phrase (opposition) : connecteur."],
    ["Il est fatigué, *donc* il dort.", "connecteur", "adverbe", "« donc » relie deux idées (conséquence) : connecteur."],
    ["Le *rouge* est ma couleur préférée.", "nom", "adjectif", "Ici « rouge » est précédé d'un déterminant (« le ») : c'est un nom."],
    ["Elle porte une robe *rouge*.", "adjectif", "nom", "« rouge » précise le nom « robe » : adjectif."],
    ["*Courir* fait du bien.", "verbe", "nom", "« courir » est un verbe à l'infinitif, même s'il est sujet."],
    ["*Ces* fleurs sentent bon.", "déterminant", "pronom", "« ces » est devant un nom : déterminant."],
    ["*Celui-ci* est à moi.", "pronom", "déterminant", "« celui-ci » remplace un nom : pronom."],
    ["Il fait *très* froid.", "adverbe", "adjectif", "« très » modifie « froid » et est invariable : adverbe."],
    ["Le *froid* arrive.", "nom", "adjectif", "Précédé de « le », « froid » est ici un nom."],
    ["*Hier*, nous sommes allés au musée.", "adverbe", "nom", "« hier » indique le temps et est invariable : adverbe."],
    ["*Nous* partons demain.", "pronom", "déterminant", "« nous » est un pronom personnel sujet."],
    ["Je mange *une* pomme.", "déterminant", "pronom", "« une » est devant le nom « pomme » : déterminant."],
    ["J'en veux *une*.", "pronom", "déterminant", "Ici « une » est seul : il remplace « une pomme ». C'est un pronom."],
    ["La maison *dont* je rêve est grande.", "pronom", "connecteur", "« dont » remplace « la maison » (je rêve de la maison) : pronom relatif."],
    ["La pomme *que* je mange est rouge.", "pronom", "connecteur", "« que » remplace « la pomme » : pronom relatif."],
    ["Il sait *que* tu viens.", "connecteur", "pronom", "Ici « que » ne remplace rien : il relie deux parties de phrase. C'est un connecteur."],
    ["*Si* tu viens, je serai content.", "connecteur", "adverbe", "« si » introduit une condition et relie deux parties : connecteur."],
    ["Ce gâteau est *délicieux*.", "adjectif", "adverbe", "« délicieux » dit comment est le gâteau et s'accorde : adjectif."],
    ["Mon *frère* joue au foot.", "nom", "adjectif", "« frère » est précédé du déterminant « mon » : nom."],
    ["Nous *avons* un chat.", "verbe", "nom", "« avons » est le verbe avoir conjugué au présent."],
    ["Ils jouent *avec* leurs amis.", "connecteur", "adverbe", "« avec » est une préposition : un connecteur."],

      Q("Qu'est-ce qu'un attribut ?", "Une caractéristique qu'on peut observer chez un être vivant", ["L'endroit où vit un animal (son milieu de vie)", "Ce que mange un animal (son régime alimentaire)", "Le nom scientifique en latin d'un animal"], "Ex. : des plumes, des poils, un squelette interne, des pattes articulées, des nageoires."),
      Q("Quel attribut ont tous les vertébrés ?", "Un squelette interne (une colonne vertébrale)", ["Des poils sur tout le corps", "Des plumes ou des écailles", "Quatre pattes pour marcher"], "Poissons, amphibiens, reptiles, oiseaux et mammifères ont un squelette interne."),
      Q("Quel attribut ont les insectes, les araignées et les crabes ?", "Des pattes articulées et un squelette externe", ["Un squelette interne et des poils", "Six pattes et deux paires d'ailes", "Des nageoires et des écailles"], "Leur squelette est à l'extérieur (carapace) et leurs pattes sont articulées."),
      Q("Comment classe-t-on les vivants en sciences ?", "En ensembles emboîtés, selon les attributs partagés", ["Par ordre alphabétique", "Selon leur taille", "Selon qu'ils sont utiles ou nuisibles"], "Plus deux espèces partagent d'attributs, plus elles sont proches (ancêtre commun)."),
      Q("Le chat partage plus d'attributs avec la souris qu'avec le pigeon. Que peut-on dire ?", "Le chat est plus proche de la souris", ["Le chat est plus proche du pigeon", "Ils sont tous les trois aussi proches", "Ils ne peuvent pas être classés"], "Chat et souris sont des mammifères (poils, mamelles). Le pigeon a des plumes."),
      Q("Pour classer 5 animaux, quel outil t'aide à remplir les ensembles emboîtés ?", "Un tableau d'attributs partagés (animaux × attributs, ✓ ou ✗)", ["Une frise chronologique avec les dates d'apparition", "Un diagramme circulaire des tailles des animaux", "Une carte de géographie des milieux de vie"], "On coche case par case, puis on regroupe ceux qui partagent le plus d'attributs."),
      Q("Quel attribut permet de reconnaître un oiseau ?", "Des plumes", ["Des ailes", "Un bec qui vole", "Des œufs"], "Piège : la chauve-souris et le papillon ont des ailes. Les plumes, seuls les oiseaux en ont.")
    ],
    feu: [
      Q("La combustion est-elle un phénomène physique ou chimique ?", "Chimique : la matière est transformée", ["Physique : la matière garde sa nature", "Physique : c'est un changement d'état", "Ni l'un ni l'autre"], "Le bois devient cendres et fumée : ce n'est plus la même matière."),
      Q("Quels sont les 3 éléments du triangle du feu ?", "Un combustible, un comburant (le dioxygène) et une énergie d'amorçage", ["Du bois, de l'eau et du vent", "Un combustible, de l'eau et de la lumière", "Du dioxyde de carbone, de l'eau et de la chaleur"], "Si un des trois manque, le feu s'éteint."),
      Q("Qu'est-ce que la combustion libère ?", "De l'énergie thermique, du dioxyde de carbone et de l'eau", ["Du dioxygène et de l'eau", "Seulement de la lumière", "Du dioxygène et du dioxyde de carbone"], "Elle consomme du dioxygène et libère chaleur (énergie thermique), dioxyde de carbone et eau (vapeur)."),
      Q("On pose un verre retourné sur une bougie allumée. Pourquoi s'éteint-elle ?", "Elle n'a plus assez de dioxygène", ["Le verre la refroidit trop", "Elle a brûlé toute la cire", "Le verre bloque la lumière"], "Sans comburant (dioxygène), pas de combustion."),
      Q("Quels sont les 3 moyens d'éteindre un feu ?", "Priver d'air, refroidir, ou utiliser un extincteur", ["Souffler fort, ajouter du bois, ouvrir la fenêtre", "Ajouter du dioxygène, refroidir, souffler", "Attendre, ajouter de l'eau tiède, ventiler"], "On retire un des 3 éléments du triangle du feu. Ouvrir une fenêtre apporte du dioxygène : ça attise le feu !"),
      Q("Quelle transformation d'énergie a lieu dans une bougie qui brûle ?", "L'énergie chimique devient énergie thermique (et lumineuse)", ["L'énergie thermique devient énergie chimique", "L'énergie électrique devient énergie thermique", "L'énergie mécanique devient énergie lumineuse"], "La cire contient de l'énergie chimique, libérée en brûlant."),
      Q("Dans le triangle du feu, quel est le comburant ?", "Le dioxygène de l'air", ["Le bois", "L'allumette", "La fumée"], "Combustible = ce qui brûle (bois) ; comburant = dioxygène ; énergie d'amorçage = allumette, étincelle."),
      Q("Quel changement est une combustion ?", "Une bûche qui brûle dans la cheminée", ["De la glace qui fond au soleil", "Du sucre qui se dissout dans l'eau", "De l'eau qui bout dans une casserole"], "Fondre, se dissoudre, bouillir : phénomènes physiques. Brûler : phénomène chimique.")
    ],
    energie2: [
      Q("Dans quel sens l'énergie thermique se transfère-t-elle ?", "Toujours du plus chaud vers le plus froid", ["Toujours du plus froid vers le plus chaud", "Dans les deux sens à la fois", "Du plus petit objet vers le plus grand"], "Quand tu tiens un glaçon, ta main a froid parce qu'elle perd de la chaleur vers le glaçon."),
      Q("Pourquoi le double vitrage isole-t-il bien ?", "Il emprisonne de l'air, qui est isolant", ["Le verre est un très bon isolant", "Il laisse passer plus de soleil", "Il chauffe la maison tout seul"], "Le verre est plutôt conducteur ; c'est la couche d'air emprisonné qui isole."),
      Q("Pour limiter les pertes de chaleur d'une maison, quelle partie isoler en priorité ?", "Le toit", ["La cave", "Les portes intérieures", "Le garage"], "La chaleur monte : un toit mal isolé fait perdre beaucoup d'énergie."),
      Q("Quels sont les 4 leviers pour limiter les pertes de chaleur d'une maison ?", "Isoler, double vitrage, baisser la température, fermer portes et fenêtres", ["Ouvrir les fenêtres, chauffer plus, isoler, double vitrage", "Peindre en blanc, isoler la cave, chauffer la nuit, aérer longtemps", "Changer de chauffage, ouvrir les portes, baisser les volets, chauffer plus"], "Baisser le chauffage de 1 °C peut faire économiser jusqu'à 7 % d'énergie."),
      Q("Qu'est-ce qu'une énergie renouvelable ?", "Une énergie qui se reconstitue rapidement à l'échelle humaine", ["Une énergie qui ne pollue jamais du tout", "Une énergie qu'on peut acheter plusieurs fois", "Une énergie qui met des millions d'années à se former"], "Renouvelables : soleil, vent, eau, bois. Non renouvelables (millions d'années) : pétrole, gaz naturel, charbon.")
    ]
  };

  const MAT_C = ["le cuivre", "l'aluminium", "le fer", "l'acier d'une casserole", "le verre"];
  const MAT_I = ["le bois", "la laine", "le plastique", "le polystyrène", "le liège", "l'air emprisonné (double vitrage)"];
  const ENERGIES = [["Frotter ses mains l'une contre l'autre", "mécanique"], ["Freiner fort à vélo : les freins chauffent", "mécanique"], ["Le soleil chauffe une voiture garée", "lumineuse"], ["Une ampoule allumée devient chaude", "lumineuse"],
    ["Un radiateur électrique chauffe la pièce", "électrique"], ["Un fer à repasser branché chauffe", "électrique"], ["Une bougie brûle", "chimique"], ["Un poêle à bois chauffe la maison", "chimique"]];
  const RENOUV = ["le soleil", "le vent", "l'eau d'une rivière", "le bois"], NONRENOUV = ["le pétrole", "le gaz naturel", "le charbon", "le mazout"];
  G.energieGen = i => {
    const k = i % 4;
    if (k === 0) { const good = pick(MAT_I); return qcm("Lequel de ces matériaux est un <b>isolant</b> (il bloque la chaleur) ?", [good].concat(shuffle(MAT_C).slice(0, 3)), "Isolants : bois, laine, plastique, polystyrène, liège, air emprisonné. Conducteurs : les métaux (cuivre, aluminium, fer) et le verre. Réponse : <b>" + good + "</b>."); }
    if (k === 1) { const good = pick(MAT_C); return qcm("Lequel de ces matériaux est un <b>conducteur</b> (il laisse passer la chaleur) ?", [good].concat(shuffle(MAT_I).slice(0, 3)), "Les métaux et le verre sont conducteurs. Réponse : <b>" + good + "</b>."); }
    if (k === 2) { const [s, f] = pick(ENERGIES); return qcm("« " + s + " » : quelle forme d'énergie se transforme en énergie thermique ?", ["L'énergie " + f].concat(["mécanique", "lumineuse", "électrique", "chimique"].filter(x => x !== f).map(x => "L'énergie " + x)),
      "4 formes d'énergie peuvent devenir de la chaleur : mécanique (frottement), lumineuse (soleil, lampe), électrique (radiateur), chimique (combustion). Ici : <b>" + f + "</b>."); }
    const ren = Math.random() < 0.5;
    if (ren) { const good = pick(RENOUV); return qcm("Laquelle de ces sources d'énergie est <b>renouvelable</b> ?", [good].concat(shuffle(NONRENOUV).slice(0, 3)), "Renouvelables : soleil, vent, eau, bois (ils se reconstituent vite). Pétrole, gaz, charbon : des millions d'années."); }
    const good = pick(NONRENOUV); return qcm("Laquelle de ces sources d'énergie est <b>non renouvelable</b> ?", [good].concat(shuffle(RENOUV).slice(0, 3)), "Pétrole, mazout, gaz naturel, charbon mettent des millions d'années à se former.");
  };

  // savoir scientifique / croyance / hypothèse / observation
  const SAV = [
    ["L'eau pure bout à 100 °C au niveau de la mer.", "S", "Vérifié par des expériences répétées : savoir scientifique."],
    ["Le dioxygène entre dans le sang au niveau des alvéoles.", "S", "Démontré et vérifié : savoir scientifique."],
    ["La Terre tourne autour du Soleil.", "S", "Prouvé par des observations et des mesures : savoir scientifique."],
    ["Les métaux conduisent la chaleur.", "S", "On peut le vérifier par une expérience reproductible : savoir scientifique."],
    ["Il paraît que les chats noirs portent malheur.", "C", "« Il paraît que » : rien n'est démontré. C'est une croyance."],
    ["Porter mon pull bleu me fait gagner les matchs.", "C", "Aucune expérience ne le prouve : croyance."],
    ["Mon horoscope dit que je vais avoir de la chance.", "C", "Non démontré : croyance."],
    ["Je pense que les haricots poussent plus vite à la lumière : je vais le tester.", "H", "Une idée qu'on va vérifier par une expérience : hypothèse."],
    ["Peut-être que le sel fait fondre la glace plus vite. Vérifions-le.", "H", "On propose une explication à tester : hypothèse."],
    ["Si je mets la plante dans le noir, elle jaunira peut-être. Je vais essayer.", "H", "Une supposition à vérifier : hypothèse."],
    ["Le thermomètre placé au soleil indique 28 °C.", "O", "On constate un fait, avec un instrument : observation."],
    ["Après trois jours, les haricots à la lumière mesurent 5 cm.", "O", "On note ce qu'on voit et mesure : observation."],
    ["La bougie s'éteint quand on la couvre avec un verre.", "O", "On décrit ce qu'on voit pendant l'expérience : observation."]
  ];
  const SLAB = { S: "Un savoir scientifique (vérifié par des expériences)", C: "Une croyance (non démontrée)", H: "Une hypothèse (une idée à tester)", O: "Une observation (ce que je constate)" };
  G.savoir = bank(SAV, ([s, k, x]) => qcm("Cette phrase est…" + T("« " + s + " »"), [SLAB[k]].concat(Object.keys(SLAB).filter(z => z !== k).map(z => SLAB[z])), x));

  // vrai / faux / impossible à dire
  const VFI_TXT = [
    ["Léa place 2 pots de haricots identiques : un près de la fenêtre, un dans une armoire fermée. Elle les arrose de la même façon. Après 10 jours, ceux de la fenêtre mesurent 8 cm et sont verts ; ceux de l'armoire mesurent 12 cm et sont jaunes.", [
      ["Les haricots de l'armoire sont plus grands.", "V", "12 cm > 8 cm : c'est écrit dans le texte."],
      ["Les haricots de la fenêtre sont jaunes.", "F", "Le texte dit qu'ils sont verts."],
      ["Léa a utilisé de l'eau du robinet.", "I", "Le texte dit qu'elle arrose « de la même façon », mais ne dit pas avec quelle eau."],
      ["Les deux pots ont reçu la même quantité d'eau.", "V", "« Elle les arrose de la même façon » : seule la lumière change."],
      ["Les haricots de l'armoire vont mourir dans un mois.", "I", "Le texte ne parle pas de la suite de l'expérience."]]],
    ["Tom chauffe de l'eau dans une casserole. Il note la température chaque minute : 20 °C, 45 °C, 70 °C, 95 °C, 100 °C, 100 °C. À 100 °C, de grosses bulles apparaissent.", [
      ["La température a cessé de monter à 100 °C.", "V", "Les deux dernières mesures sont 100 °C."],
      ["L'eau a bouilli à 95 °C.", "F", "Les grosses bulles apparaissent à 100 °C."],
      ["Tom a utilisé une casserole en cuivre.", "I", "Le texte ne dit pas en quoi est la casserole."],
      ["Tom a fait 6 mesures.", "V", "On compte 6 températures."],
      ["L'eau était salée.", "I", "Rien ne l'indique dans le texte."]]]
  ];
  const VFI = []; VFI_TXT.forEach(([txt, list]) => list.forEach(([s, k, x]) => VFI.push([txt, s, k, x])));
  const VLAB = { V: "Vrai", F: "Faux", I: "Impossible à dire (le document ne le dit pas)" };
  G.vfi = bank(VFI, ([txt, s, k, x]) => qcm("Lis le document." + T(txt) + "« " + s + " » Trace une croix : c'est…", [VLAB[k]].concat(Object.keys(VLAB).filter(z => z !== k).map(z => VLAB[z])), x + " Ne réponds qu'avec ce que dit le document."));

  // ================================================================ FHGES
  const PERIODES = [["la Préhistoire", -1e9, -3500], ["l'Antiquité", -3500, 476], ["le Moyen Âge", 476, 1492], ["les Temps modernes", 1492, 1789], ["l'Époque contemporaine", 1789, 3000]];
  const yr = y => y < 0 ? window.U.fmt(-y) + " av. J.-C." : (y < 1000 ? "l'an " + y : String(y));
  G.periodeAn = i => {
    const p = rnd(0, 4); let y;
    if (p === 0) y = -rnd(36, 200) * 100; else if (p === 1) y = pick([-rnd(5, 34) * 100, rnd(1, 4) * 100 + rnd(0, 70)]); else y = rnd(PERIODES[p][1] + 1, Math.min(PERIODES[p][2], 2025) - 1);
    const good = PERIODES[p][0];
    const near = [p - 1, p + 1].filter(k => k >= 0 && k <= 4).map(k => PERIODES[k][0]);
    const opts = [good].concat(near); PERIODES.forEach(q => { if (opts.length < 4 && !opts.includes(q[0])) opts.push(q[0]); });
    const cap = s => s[0].toUpperCase() + s.slice(1);
    return qcm("Dans quelle période se situe <b>" + yr(y) + "</b> ?", opts.map(cap),
      "Repères : ≈ 3500 av. J.-C. (écriture), 476 (chute de l'Empire romain d'Occident), 1492 (Christophe Colomb), 1789 (Révolution française). " + yr(y)[0].toUpperCase() + yr(y).slice(1) + " → <b>" + good + "</b>." + (y < 0 ? " Avant J.-C., plus le nombre est grand, plus c'est ancien." : ""));
  };

  const SRC = [
    ["une lettre écrite par un soldat en 1916", "T"], ["une photo de mineurs prise en 1955", "T"], ["une pièce de monnaie romaine", "T"], ["une affiche belge de 1946 qui invite les Italiens à venir travailler", "T"], ["un outil en silex de la Préhistoire", "T"], ["un château fort du Moyen Âge", "T"],
    ["une frise chronologique dans ton manuel", "R"], ["une reconstitution en 3D d'un château fort", "R"], ["un film historique tourné en 2020", "R"], ["un dessin d'un village gaulois fait par un illustrateur aujourd'hui", "R"], ["une carte des invasions dessinée pour un livre scolaire", "R"]
  ];
  G.sources = bank(SRC, ([s, k]) => qcm("Est-ce une trace du passé ou un document reconstitué : <b>" + s + "</b> ?",
    k === "T" ? ["Une trace du passé : elle date de l'époque", "Un document reconstitué : il a été fait après coup", "Une trace du passé : il suffit qu'elle parle du passé", "Un document reconstitué : il est ancien"]
      : ["Un document reconstitué : il a été fait après coup pour expliquer le passé", "Une trace du passé : il parle du passé", "Une trace du passé : il date de l'époque", "Un document reconstitué : il est ancien"],
    "Une <b>trace du passé</b> a été produite à l'époque (lettre, photo, objet, bâtiment). Un <b>document reconstitué</b> est fait aujourd'hui pour expliquer le passé (frise de manuel, film, maquette 3D)."));

  // rose des vents
  const DIR = [["le nord", 0, -1], ["le nord-est", 1, -1], ["l'est", 1, 0], ["le sud-est", 1, 1], ["le sud", 0, 1], ["le sud-ouest", -1, 1], ["l'ouest", -1, 0], ["le nord-ouest", -1, -1]];
  const VILLES = ["Vauclair", "Bérode", "Courval", "Dinsart", "Mesnil", "Floreu", "Grandpré", "Hautsy"];
  G.rose = i => {
    const names = shuffle(VILLES); const center = names[0]; const k = rnd(0, 7); const other = names[1];
    const cx = 160, cy = 120, r = 85;
    let s = "<svg viewBox='0 0 380 240' style='width:100%;max-width:380px;background:#f6fbf5;border:1px solid #e1e6ee;border-radius:10px;display:block;margin:8px auto'>";
    s += "<g transform='translate(330,55)'><polygon points='0,-34 6,-8 -6,-8' fill='#c0392b'/><polygon points='0,34 6,8 -6,8' fill='#9aa5b1'/><text x='0' y='-38' text-anchor='middle' font-weight='700' font-size='14'>N</text></g>";
    const pts = [[center, cx, cy]]; pts.push([other, cx + DIR[k][1] * r, cy + DIR[k][2] * r * 0.85]);
    const extra = rnd(0, 7); if (extra !== k) pts.push([names[2], cx + DIR[extra][1] * r * 0.6, cy + DIR[extra][2] * r * 0.55]);
    pts.forEach(([n, x, y]) => { s += "<circle cx='" + x + "' cy='" + y + "' r='6' fill='#2f6fd1'/><text x='" + (x + 9) + "' y='" + (y - 8) + "' font-size='14' font-weight='700'>" + n + "</text>"; });
    s += "</svg>";
    const opp = (k + 4) % 8, n1 = (k + 1) % 8, n2 = (k + 7) % 8;
    return qcm("Sur cette carte, le nord est en haut. Dans quelle direction se trouve <b>" + other + "</b> par rapport à <b>" + center + "</b> ?" + s, [DIR[k][0], DIR[opp][0], DIR[n1][0], DIR[n2][0]].map(x => x[0].toUpperCase() + x.slice(1)),
      "On part de " + center + " et on regarde où est " + other + " : <b>" + DIR[k][0] + "</b>. Piège : la direction inverse (" + DIR[opp][0] + ") est celle de " + center + " vu depuis " + other + ". Directions intermédiaires : NE, SE, SO, NO.");
  };

  const CAUSES = [["Brûler du pétrole, du gaz et du charbon", "cause"], ["L'élevage intensif (le méthane des vaches)", "cause"], ["La déforestation", "cause"], ["Les transports en voiture et en avion", "cause"], ["Le chauffage des maisons au mazout", "cause"],
    ["La fonte des glaciers", "conséquence"], ["La disparition de la banquise", "conséquence"], ["La hausse du niveau des mers", "conséquence"], ["L'augmentation de la température des océans", "conséquence"], ["La migration et la disparition d'espèces", "conséquence"],
    ["Prendre le vélo ou le train", "solution"], ["Manger local et moins de viande", "solution"], ["Planter des arbres (reforestation)", "solution"], ["Isoler sa maison", "solution"], ["Utiliser l'énergie du soleil et du vent", "solution"]];
  const CLAB = { cause: "Une cause du réchauffement climatique", "conséquence": "Une conséquence du réchauffement climatique", solution: "Une solution pour atténuer le réchauffement" };
  G.climatCC = bank(CAUSES, ([s, k]) => qcm("« " + s + " », c'est…", [CLAB[k]].concat(Object.keys(CLAB).filter(z => z !== k).map(z => CLAB[z]), ["Un phénomène sans lien avec le climat"]),
    "Causes : activités humaines qui libèrent des gaz à effet de serre. Conséquences : ce que le réchauffement provoque. Solutions : énergie, transports, alimentation, logement, forêt, consommation."));

  const FH = {
    reperes: [
      Q("Quels sont les 5 faits marquants qui séparent les périodes ?", "≈ 3500 av. J.-C., an 1, 476, 1492, 1789", ["3300 av. J.-C., 800, 1000, 1500, 1830", "≈ 3500 av. J.-C., 476, 800, 1492, 1914", "an 1, 476, 1000, 1492, 1945"], "≈ 3500 av. J.-C. : écriture. An 1 : début de l'ère chrétienne. 476 : chute de l'Empire romain d'Occident. 1492 : Christophe Colomb. 1789 : Révolution française."),
      Q("Que marque l'an 1 sur la frise ?", "Le début de l'ère chrétienne (naissance de Jésus-Christ, repère de notre calendrier)", ["La chute de l'Empire romain d'Occident (fin de l'Antiquité)", "L'invention de l'écriture (fin de la Préhistoire)", "Le couronnement de Charlemagne (empereur des Francs)"], "Avant l'an 1 : « av. J.-C. » (on compte à rebours). Après : « apr. J.-C. »."),
      Q("Qu'est-ce qui est le plus ancien ?", "3500 av. J.-C.", ["500 av. J.-C.", "An 1", "476"], "Avant J.-C., l'ordre est inversé : plus le nombre est grand, plus c'est ancien."),
      Q("Combien d'années séparent 500 av. J.-C. et 500 apr. J.-C. ?", "1 000 ans", ["0 an", "500 ans", "2 000 ans"], "500 ans pour arriver à l'an 1, puis encore 500 ans : 500 + 500 = 1 000."),
      Q("Qui était Charlemagne ?", "L'empereur des Francs, couronné en 800 (Moyen Âge)", ["L'explorateur qui atteint l'Amérique en 1492", "Un roi de la Révolution française", "Un empereur romain de l'Antiquité"], "Charlemagne (Moyen Âge, 800) vient avant Christophe Colomb (Temps modernes, 1492)."),
      Q("Qui était Christophe Colomb ?", "L'explorateur qui atteint les Amériques en 1492", ["L'empereur des Francs couronné en 800", "Le chef des Gaulois", "Un mineur italien venu en Belgique"], "Son voyage ouvre l'ère des explorations et marque le début des Temps modernes."),

<script>
"use strict";
const PASS = 50, AVG = 60;
const ROUND = 15;
const app = document.getElementById("app");
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- progrès (gardé dans ce navigateur seulement) ----------
let STORE = {};
try { STORE = JSON.parse(localStorage.getItem("ceb-v1") || "{}"); } catch (e) { STORE = {}; }
function save() { try { localStorage.setItem("ceb-v1", JSON.stringify(STORE)); } catch (e) {} }
function stat(key) { return STORE[key] || null; }
function record(key, firstTry) { STORE[key] = { ok: firstTry, t: Date.now() }; save(); }

// ---------- navigation ----------
let view = { name: "home" };
function go(v) { view = v; render(); window.scrollTo(0, 0); }
$("#home").onclick = () => go({ name: "home" });
$("#back").onclick = () => {
  if (view.name === "subject") go({ name: "home" });
  else if (view.subject) go({ name: "subject", subject: view.subject });
  else go({ name: "home" });
};
function crumbs(text) { $("#crumbs").textContent = text || ""; $("#back").hidden = view.name === "home"; }

const subjectById = id => SUBJECTS.find(s => s.id === id);
const themeKeys = (s, t) => itemsOf(t).map((_, i) => s.id + "/" + t.id + "/" + i);
function itemsOf(t) {
  if (t.type === "decode") return t.words.concat(t.special);
  if (t.type === "diagram") return t.regions;
  if (t.type === "order" || t.type === "century" || t.type === "gen") return Array.from({ length: t.count }, (_, i) => i);
  return t.items;
}
function mastery(s, t) {
  const keys = themeKeys(s, t);
  const m = keys.filter(k => stat(k) && stat(k).ok).length;
  return [m, keys.length];
}

// ---------- écrans ----------
function render() {
  if (view.name === "home") return renderHome();
  if (view.name === "subject") return renderSubject();
  if (view.name === "sheet") return renderSheet();
  if (view.name === "play") return renderQuestion();
}

function renderHome() {
  crumbs("");
  let html = "<h2>Préparation au CEB</h2><p class='lead'>En juin de la 6e primaire, le CEB évalue le français, les mathématiques, les sciences et la formation historique et géographique. Pour le réussir, il faut au moins " + PASS + " % dans chacune des quatre matières et au moins " + AVG + " % de moyenne. Ici, chaque manche te donne ton pourcentage : vise toujours plus de " + AVG + " % !</p><div class='grid'>";
  SUBJECTS.forEach(s => {
    let m = 0, n = 0;
    s.themes.forEach(t => { const [a, b] = mastery(s, t); m += a; n += b; });
    html += "<div class='subject' data-s='" + s.id + "'><h3>" + esc(s.title) + (s.ceb ? "" : " <span style='font-size:12px;color:#5f6b76;font-weight:600'>(hors CEB)</span>") + "</h3><p>" + esc(s.blurb) + "</p><div class='meta'>" + m + " / " + n + " maîtrisés</div></div>";
  });
  html += "</div>";
  app.innerHTML = html;
  app.querySelectorAll("[data-s]").forEach(el => el.onclick = () => go({ name: "subject", subject: el.dataset.s }));
}

function renderSubject() {
  const s = subjectById(view.subject);
  crumbs(s.title);
  let html = "<h2>" + esc(s.title) + "</h2><p class='lead'>" + esc(s.blurb) + "</p>";
  html += "<button class='primary mixall' id='mix'>Tout mélanger (20 questions)</button>";
  let sec = null;
  s.themes.forEach(t => {
    const [m, n] = mastery(s, t);
    if (t.section && t.section !== sec) {
      sec = t.section;
      const st = s.themes.filter(x => x.section === sec);
      let sm = 0, sn = 0; st.forEach(x => { const [a, b] = mastery(s, x); sm += a; sn += b; });
      html += "<div class='sechead'><h3>" + esc(sec) + "</h3><span>" + sm + " / " + sn + " maîtrisés</span>" + (st.length > 1 ? "<button data-secmix='" + esc(sec) + "'>Mélanger la section (20)</button>" : "") + "</div>";
    }
    html += "<div class='theme'><div class='t'><b>" + esc(t.title) + "</b><div>" + m + " / " + n + " maîtrisés</div><div class='bar'><i style='width:" + Math.round(100 * m / n) + "%'></i></div></div>" +
      "<div class='btns'><button data-sheet='" + t.id + "'>" + (t.type === "diagram" ? "Voir le schéma" : t.type === "gen" ? "La méthode" : "Fiches") + "</button>" +
      (n > ROUND ? "<button data-all='" + t.id + "'>Tout le thème (" + n + ")</button>" : "") +
      "<button class='primary' data-play='" + t.id + "'>Jouer" + (n > ROUND ? " (" + ROUND + ")" : "") + "</button></div></div>";
  });
  app.innerHTML = html;
  app.querySelectorAll("[data-play]").forEach(b => b.onclick = () => startRound(s, [s.themes.find(t => t.id === b.dataset.play)], ROUND));
  app.querySelectorAll("[data-all]").forEach(b => b.onclick = () => { const t = s.themes.find(x => x.id === b.dataset.all); startRound(s, [t], itemsOf(t).length); });
  app.querySelectorAll("[data-sheet]").forEach(b => b.onclick = () => go({ name: "sheet", subject: s.id, theme: b.dataset.sheet }));
  $("#mix").onclick = () => startRound(s, s.themes, 20);
  app.querySelectorAll("[data-secmix]").forEach(b => b.onclick = () => startRound(s, s.themes.filter(t => t.section === b.dataset.secmix), 20));
}

function renderSheet() {
  const s = subjectById(view.subject), t = s.themes.find(x => x.id === view.theme);
  crumbs(s.title + " › " + t.title);
  let html = "<h2>" + esc(t.title) + "</h2>";
  if (t.intro) html += "<p class='note'>" + esc(t.intro) + "</p>";
  if (t.type === "diagram") {
    html += "<div class='card'>" + DIAGRAMS[t.diagram](true) + "</div><table class='sheet' style='margin-top:14px'>" +
      t.regions.map(r => "<tr><td>" + esc(r[1]) + "</td><td>" + esc(r[2]) + "</td></tr>").join("") + "</table>";
  } else if (t.type === "facts") {
    const groups = [...new Set(t.items.map(i => i[2]))];
    html += "<table class='sheet'>";
    groups.forEach(g => {
      if (groups.length > 1 && GROUP_NAMES[g]) html += "<tr class='grp'><td colspan='2'>" + GROUP_NAMES[g] + "</td></tr>";
      t.items.filter(i => i[2] === g).forEach(i => html += "<tr><td>" + esc(i[0]) + "</td><td>" + esc(i[1]) + "</td></tr>");
    });
    html += "</table>";
  } else if (t.type === "gen") {
    html += "<div class='sheetq'>" + (t.method || "Des exercices nouveaux à chaque partie.") + "</div>";
  } else if (t.type === "events") {
    html += "<table class='sheet'>" + t.items.slice().sort((a, b) => a[2] - b[2]).map(e => "<tr><td>" + esc(e[1]) + "</td><td>" + esc(e[0]) + "</td></tr>").join("") + "</table>";
  } else if (t.type === "order") {
    html += "<p class='note'>Toutes les dates du sujet sur une seule frise, de la plus ancienne à la plus récente. B = Belgique, F = France, M = monde.</p><table class='sheet'>" +
      allEvents(s).sort((a, b) => a.y - b.y).map(e => "<tr><td>" + esc(e.d) + "</td><td>" + esc(e.label) + " <span style='color:#5f6b76;font-size:13px'>(" + e.tag + ")</span></td></tr>").join("") + "</table>";
  } else if (t.type === "century") {
    html += "<div class='sheetq'><b>La règle :</b> on compte les centaines et on ajoute 1.<br>1830 → 18 centaines → 18 + 1 = <span class='a'>XIXe siècle</span>.<br>476 → 4 centaines → <span class='a'>Ve siècle</span>.<br><br>" +
      "<b>Le piège :</b> 1830 n'est pas le XVIIIe siècle ! Le XVIIIe siècle va de 1701 à 1800.<br><b>Les années rondes :</b> 1900 est la dernière année du XIXe siècle (1801 à 1900). 2000 est la dernière année du XXe siècle.<br><b>Avant J.-C. :</b> même règle, mais on ajoute « av. J.-C. » : 52 av. J.-C. → Ier siècle av. J.-C.</div>" +
      "<div class='sheetq'><b>Les chiffres romains :</b> I = 1, V = 5, X = 10, L = 50. On met I avant V ou X pour enlever 1 : IV = 4, IX = 9, XIV = 14, XIX = 19, XXI = 21.</div>";
  } else if (t.type === "decode") {
    html += "<p class='note'>Un mot médical se lit comme un puzzle : racine (l'organe) + préfixe ou suffixe (ce qui se passe). Les pièces sont dans la fiche « racines, préfixes, suffixes ».</p><table class='sheet'>";
    t.words.forEach(w => { const o = t.organs[w[1]], sf = t.suffixes[w[2]]; html += "<tr><td>" + esc(w[0]) + "</td><td>" + esc(sf[1].replace("{o}", o[1])) + "</td></tr>"; });
    t.special.forEach(sp => html += "<tr><td>" + esc(sp.w) + "</td><td>" + esc(sp.a) + "<div style='color:#5f6b76;font-size:13px'>" + esc(sp.x) + "</div></td></tr>");
    html += "</table>";
  } else {
    t.items.forEach(q => html += "<div class='sheetq'><b>" + esc(q.q) + "</b><br><span class='a'>" + esc(q.a) + "</span><div class='x'>" + esc(q.x) + "</div></div>");
  }
  html += "<p style='text-align:center;margin-top:18px'><button class='primary' id='playnow'>Jouer maintenant</button></p>";
  app.innerHTML = html;
  $("#playnow").onclick = () => startRound(s, [t], ROUND);
}

const GROUP_NAMES = {
  partie: "Les parties du cerveau", cellule: "Les cellules", nerf: "La moelle et les nerfs", protection: "Ce qui protège le cerveau",
  circulation: "Le sang", respiration: "La respiration", digestion: "La digestion", urine: "L'urine", autre: "Autres",
  cavite: "L'intérieur du cœur", vaisseau: "Les vaisseaux", sang: "Le sang",
  tete: "La tête", tronc: "Le tronc", bras: "L'épaule, le bras et la main", jambe: "Le bassin, la jambe et le pied",
  haut: "Le haut du corps", bas: "Le bas du corps", oeil: "L'œil", oreille: "L'oreille",
  be: "Belgique", fr: "France", monde: "Monde",
  organe: "Racines (organes et choses)", prefixe: "Préfixes (au début du mot)", suffixe: "Suffixes (à la fin du mot)"
};

Object.assign(GROUP_NAMES, window.GROUP_EXTRA || {});

// ---------- fabrication des questions ----------
function distractors(pool, correct, n) {
  const out = [], seen = new Set([correct]);
  for (const x of pool) { if (!seen.has(x)) { seen.add(x); out.push(x); } if (out.length === n) break; }
  return out;
}

function roman(n) {
  const v = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
  let r = ""; for (const [k, l] of v) while (n >= k) { r += l; n -= k; } return r;
}
function centuryLabel(c) { return c > 0 ? roman(c) + (c === 1 ? "er" : "e") + " siècle" : roman(-c) + (c === -1 ? "er" : "e") + " siècle av. J.-C."; }
function centuryOf(y) { return y > 0 ? Math.floor((y - 1) / 100) + 1 : -(Math.floor((-y - 1) / 100) + 1); }
const TAGS = { belgique: "B", france: "F", monde: "M" };
function allEvents(s) {
  const out = [];
  s.themes.filter(t => t.type === "events").forEach(t => t.items.forEach(e => out.push({ label: e[0], d: e[1], y: e[2], tag: TAGS[t.id] || "" })));
  return out;
}

function makeQuestion(s, t, idx) {
  const key = s.id + "/" + t.id + "/" + idx;
  if (t.type === "gen") {
    const g = GEN[t.gen](idx);
    g.key = key;
    if (g.kind === "qcm" && g.options && typeof g.options[0] === "string") {
      const good = g.options[0];
      g.options = shuffle(g.options).map(o => ({ label: o, correct: o === good }));
    }
    return g;
  }
  if (t.type === "facts") {
    const it = t.items[idx];
    const same = shuffle(t.items.filter((x, i) => i !== idx && x[2] === it[2]));
    const other = shuffle(t.items.filter((x, i) => i !== idx && x[2] !== it[2]));
    const pool = same.concat(other);
    const toInfo = Math.random() < 0.5;
    const col = toInfo ? 1 : 0;
    const wrong = distractors(pool.map(x => x[col]), it[col], 3);
    const opts = shuffle([it[col]].concat(wrong));
    return {
      key, kind: "qcm", long: toInfo,
      prompt: toInfo ? t.toInfo.replace("{name}", "<b>" + esc(it[0]) + "</b>") : t.toName.replace("{info}", "<b>" + esc(it[1]) + "</b>"),
      options: opts.map(o => ({ label: o, correct: o === it[col] })),
      learn: "<b>" + esc(it[0]) + "</b> : " + esc(it[1]) + ".",
      learnWrong: lab => { const ch = t.items.find(x => x[col] === lab); return ch ? "Ce que tu as choisi, <b>" + esc(ch[0]) + "</b>, c'est : " + esc(ch[1]) + "." : ""; }
    };
  }
  if (t.type === "events") {
    const it = t.items[idx];
    // mauvaises réponses : les événements les plus proches dans le temps (et pas la même date)
    const near = t.items.filter(x => x !== it && x[1] !== it[1]).sort((a, b) => Math.abs(a[2] - it[2]) - Math.abs(b[2] - it[2])).slice(0, 4);
    const askDate = Math.random() < 0.5;
    const wrong = shuffle(near).slice(0, 3);
    const opts = shuffle([it].concat(wrong));
    return {
      key, kind: "qcm", long: !askDate,
      prompt: askDate ? "Quand ? <b>" + esc(it[0]) + "</b>" : "Que s'est-il passé en <b>" + esc(it[1]) + "</b> ?",
      options: opts.map(o => ({ label: askDate ? o[1] : o[0], correct: o === it })),
      learn: "<b>" + esc(it[1]) + "</b> : " + esc(it[0]) + ".",
      learnWrong: lab => { const ch = t.items.find(x => (askDate ? x[1] : x[0]) === lab); return ch ? "Et ta réponse : <b>" + esc(ch[1]) + "</b> : " + esc(ch[0]) + "." : ""; }
    };
  }
  if (t.type === "century") {
    const pool = allEvents(s).map(e => e.y).filter(y => y > 100 || y < -100);
    let y = Math.random() < 0.5 ? pick(pool) : 101 + Math.floor(Math.random() * 1925);
    if (Math.random() < 0.15) y = pick([1800, 1900, 2000, 1500, 1700]); // années rondes : piège
    const c = centuryOf(y);
    const naive = y > 0 ? Math.floor(y / 100) : -Math.floor(-y / 100); // erreur classique : les deux premiers chiffres
    const cands = [naive, c + 1, c - 1, c + 2, c - 2].filter(x => x !== c && x !== 0 && x <= 21);
    const wrong = [...new Set(cands)].slice(0, 3);
    const yl = y > 0 ? String(y) : (-y) + " av. J.-C.";
    const hund = Math.floor((Math.abs(y) - 1) / 100);
    return { key, kind: "qcm", prompt: "En quel siècle est l'année <b>" + yl + "</b> ?",
      options: shuffle([c].concat(wrong)).map(o => ({ label: centuryLabel(o), correct: o === c })),
      learn: yl + " → " + (Math.abs(y) % 100 === 0 ? "année ronde : c'est la dernière année du siècle, " : hund + " centaines + 1 = ") + "<b>" + centuryLabel(c) + "</b>." };
  }
  if (t.type === "order") {
    const evs = shuffle(allEvents(s));
    const chosen = [];
    for (const e of evs) { if (chosen.every(x => Math.abs(x.y - e.y) >= 3)) chosen.push(e); if (chosen.length === 4) break; }
    return { key, kind: "order", events: shuffle(chosen), sorted: chosen.slice().sort((a, b) => a.y - b.y), step: 0,
      prompt: "Clique sur les événements <b>du plus ancien au plus récent</b>.",
      learn: "Le bon ordre : " + chosen.slice().sort((a, b) => a.y - b.y).map(e => "<br>" + esc(e.d) + " : " + esc(e.label)).join("") };
  }
  if (t.type === "qcm") {
    const it = t.items[idx];
    return { key, kind: "qcm", long: [it.a].concat(it.w).some(x => x.length > 34), prompt: it.qh || esc(it.q),
      options: shuffle([it.a].concat(it.w)).map(o => ({ label: o, correct: o === it.a })), learn: esc(it.x) };
  }
  if (t.type === "decode") {
    if (idx < t.words.length) {
      const [word, org, suf] = t.words[idx];
      // plan 2x2 : chaque organe et chaque suffixe apparaît deux fois parmi les 4 réponses
      const org2 = pick(Object.keys(t.organs).filter(o => o !== org));
      const suf2 = pick(Object.keys(t.suffixes).filter(x => x !== suf));
      const txt = (o, sf) => t.suffixes[sf][1].replace("{o}", t.organs[o][1]);
      const good = txt(org, suf);
      const opts = shuffle([good, txt(org, suf2), txt(org2, suf), txt(org2, suf2)]);
      return { key, kind: "qcm", long: true, prompt: "Que veut dire : <b>" + esc(word) + "</b> ?",
        options: opts.map(o => ({ label: o, correct: o === good })),
        learn: "<b>" + esc(word) + "</b> = " + esc(t.organs[org][0]) + " + " + esc(t.suffixes[suf][0]) + " → " + esc(good.toLowerCase()) + "." };
    }
    const sp = t.special[idx - t.words.length];
    return { key, kind: "qcm", long: true, prompt: "Que veut dire : <b>" + esc(sp.w) + "</b> ?",
      options: shuffle([sp.a].concat(sp.o)).map(o => ({ label: o, correct: o === sp.a })), learn: "<b>" + esc(sp.w) + "</b> : " + esc(sp.x) };
  }
  if (t.type === "diagram") {
    const r = t.regions[idx];
    const byRole = Math.random() < 0.5;
    return { key, kind: "diagram", diagram: t.diagram, target: r[0], regions: t.regions,
      prompt: byRole ? "Clique sur la partie qui sert à : <b>" + esc(r[2]) + "</b>" : "Clique sur : <b>" + esc(r[1]) + "</b>",
      learn: "<b>" + esc(r[1]) + "</b> : " + esc(r[2]) + "." };
  }
}

// ---------- manche ----------
let R = null;
function startRound(s, themes, size) {
  // on choisit d'abord les questions ratées, puis les nouvelles, puis celles déjà sues
  let all = [];
  themes.forEach(t => itemsOf(t).forEach((_, i) => {
    const st = stat(s.id + "/" + t.id + "/" + i);
    const prio = !st ? 1 : st.ok ? 2 : 0;
    all.push({ t, i, prio, r: Math.random(), when: st ? st.t : 0 });
  }));
  all.sort((a, b) => a.prio - b.prio || (a.prio === 2 ? a.when - b.when : a.r - b.r));
  let chosen = all.slice(0, size);
  chosen = shuffle(chosen);
  R = { s, themes, size, queue: chosen.map(c => ({ t: c.t, i: c.i })), total: chosen.length, done: 0, first: 0, wrong: new Set(), wrongItems: [], current: null, q: null, locked: false };
  go({ name: "play", subject: s.id });
  nextQuestion();
}

function nextQuestion() {
  const c = R.queue.shift();
  if (!c) { renderEnd(); return; }
  R.current = c; R.locked = false; R.mustClick = false;
  R.q = makeQuestion(R.s, c.t, c.i);
  renderQuestion();
}

function renderQuestion() {
  if (!R || !R.q) return;
  const q = R.q;
  crumbs(R.s.title + " › " + (R.themes.length > 1 ? "Tout mélangé" : R.themes[0].title));
  let html = "<div class='qbar'><span>Question " + (R.done + 1) + " / " + R.total + "</span><span class='pills'>Du 1er coup<span class='g'>" + R.first +
    "</span> À revoir<span class='o'>" + R.wrongItems.length + "</span></span></div><div class='card'>";
  const again = R.wrong.has(q.key) ? "<div class='again'>Elle revient : tu t'étais trompé tout à l'heure.</div>" : "";
  html += "<div class='prompt'>" + q.prompt + again + "</div>";
  if (q.kind === "qcm") {
    html += "<div class='opts" + (q.long ? " long" : "") + "'>" + q.options.map((o, i) => "<button data-i='" + i + "'><span class='k'>" + (i + 1) + "</span> " + esc(o.label) + "</button>").join("") + "</div>";
  } else if (q.kind === "input") {
    html += "<div class='inrow'><input id='ans' type='text' inputmode='decimal' autocomplete='off' placeholder='Ta réponse'>" + (q.unit ? "<span class='unit'>" + q.unit + "</span>" : "") + "<button class='primary' id='ok'>Valider</button></div>" +
      "<div class='hint2'>" + (q.frac ? "Écris une fraction avec / (par exemple 3/4)." : "Pour les nombres à virgule, tu peux écrire 2,5 ou 2.5.") + "</div>";
  } else if (q.kind === "order") {
    html += "<div class='opts long'>" + q.events.map((e, i) => "<button data-o='" + i + "'><span class='k'></span> " + esc(e.label) + "</button>").join("") + "</div>";
  } else {
    html += DIAGRAMS[q.diagram](false);
  }
  html += "<div id='learn'></div><button class='primary next' id='next' hidden>Suivant →</button></div>";
  app.innerHTML = html;
  if (q.kind === "qcm") app.querySelectorAll(".opts button").forEach(b => b.onclick = () => answerQcm(+b.dataset.i));
  else if (q.kind === "order") app.querySelectorAll(".opts button").forEach(b => b.onclick = () => answerOrder(+b.dataset.o, b));
  else if (q.kind === "input") { $("#ok").onclick = () => answerInput(); $("#ans").focus(); }
  else app.querySelectorAll(".diagram .r").forEach(p => p.onclick = () => answerDiagram(p.dataset.r));
  $("#next").onclick = () => nextQuestion();
}

function finish(correct, extra) {
  const q = R.q;
  R.locked = true;
  const firstTry = correct && !R.wrong.has(q.key);
  if (correct) {
    R.done++;
    if (firstTry) R.first++;
    record(q.key, firstTry);
  } else {
    if (!R.wrong.has(q.key)) { R.wrong.add(q.key); R.wrongItems.push(Object.assign({}, R.current, { snap: q.prompt + " → <b>" + esc(q.answerText || (q.options ? (q.options.find(o => o.correct) || {}).label : "") || "") + "</b>" })); }
    record(q.key, false);
    R.queue.splice(Math.min(3, R.queue.length), 0, R.current); // revient un peu plus tard
  }
  const L = $("#learn");
  L.className = "learn " + (correct ? "ok" : "bad");
  L.innerHTML = (correct ? "<b>Bravo !</b> " : "<b>Retiens bien :</b> ") + q.learn + (extra ? "<div class='small'>" + extra + "</div>" : "");
  $("#next").hidden = false; $("#next").focus();
  const pills = app.querySelector(".pills");
  if (pills) pills.innerHTML = "Du 1er coup<span class='g'>" + R.first + "</span> À revoir<span class='o'>" + R.wrongItems.length + "</span>";
}

function answerQcm(i) {
  if (R.locked) return;
  const q = R.q, o = q.options[i];
  app.querySelectorAll(".opts button").forEach((b, j) => {
    b.disabled = true;
    if (q.options[j].correct) b.classList.add("right"); else if (j !== i) b.classList.add("dim");
  });
  if (!o.correct) app.querySelectorAll(".opts button")[i].classList.add("wrong");
  finish(o.correct, !o.correct && q.learnWrong ? q.learnWrong(o.label) : "");
}

function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
function parseFrac(s) {
  const m = s.match(/^(-?\d+)(?:\/(\d+))?$/);
  if (!m) return null;
  return [parseInt(m[1], 10), m[2] ? parseInt(m[2], 10) : 1];
}
function checkInput(q, raw) {
  let s = String(raw).toLowerCase().replace(/[\s\u00a0\u202f]/g, "").replace(/,/g, ".");
  s = s.replace(/^[^0-9\-.]+/, "").replace(/[^0-9./]+$/, ""); // on enlève les unités tapées (cm, €, …)
  if (!s) return false;
  if (q.frac) {
    const f = parseFrac(s); if (!f || f[1] === 0) return false;
    const [a, b] = q.frac;
    if (f[0] * b !== a * f[1]) return false;
    if (q.irreducible && gcd(f[0], f[1]) !== 1) return "nonsimplifie";
    return true;
  }
  if (!/^-?\d*\.?\d+$/.test(s)) return false;
  return Math.abs(parseFloat(s) - q.num) < 1e-6;
}
function answerInput() {
  if (R.locked) return;
  const q = R.q, inp = $("#ans");
  const v = inp.value.trim();
  if (!v) { inp.focus(); return; }
  const ok = checkInput(q, v);
  if (ok === "nonsimplifie") { $("#learn").className = "learn bad"; $("#learn").innerHTML = "C'est la bonne valeur, mais la fraction n'est pas encore simplifiée au maximum. Continue !"; inp.focus(); return; }
  inp.disabled = true; $("#ok").disabled = true;
  inp.style.borderColor = ok ? "var(--ok)" : "var(--bad)";
  finish(!!ok, ok ? "" : "Ta réponse : " + esc(v) + ". La bonne réponse : <b>" + esc(q.answerText) + "</b>");
}

function answerOrder(i, btn) {
  if (R.locked || btn.disabled) return;
  const q = R.q, e = q.events[i];
  if (e === q.sorted[q.step]) {
    q.step++;
    btn.disabled = true; btn.classList.add("right");
    btn.querySelector(".k").textContent = q.step + ".";
    btn.insertAdjacentHTML("beforeend", " <span style='font-weight:400;color:#155c2c'>(" + esc(e.d) + ")</span>");
    if (q.step === 4) finish(true);
    return;
  }
  // erreur : on montre tout l'ordre avec les dates
  btn.classList.add("wrong");
  app.querySelectorAll(".opts button").forEach((b, j) => {
    const ev = q.events[j];
    b.disabled = true;
    if (!b.classList.contains("right")) {
      b.querySelector(".k").textContent = (q.sorted.indexOf(ev) + 1) + ".";
      b.insertAdjacentHTML("beforeend", " <span style='font-weight:400;color:#5f6b76'>(" + esc(ev.d) + ")</span>");
      if (b !== btn) b.classList.add("dim");
    }
  });
  finish(false);
}

function answerDiagram(id) {
  const q = R.q;
  if (R.mustClick) {
    // après une erreur : il faut cliquer soi-même sur la bonne partie pour continuer
    if (id !== q.target) return;
    R.mustClick = false;
    const t = app.querySelector(".diagram .r[data-r='" + q.target + "']");
    t.classList.remove("target"); t.classList.add("right");
    $("#clickhint").remove();
    $("#next").hidden = false; $("#next").focus();
    return;
  }
  if (R.locked) return;
  const el = app.querySelector(".diagram .r[data-r='" + id + "']");
  const target = app.querySelector(".diagram .r[data-r='" + q.target + "']");
  if (id === q.target) { el.classList.add("right"); finish(true); return; }
  el.classList.add("wrong"); target.classList.add("target");
  const r = q.regions.find(x => x[0] === id);
  finish(false, "Tu as cliqué sur <b>" + esc(r[1]) + "</b> : " + esc(r[2]) + ".");
  R.mustClick = true;
  $("#next").hidden = true;
  $("#learn").insertAdjacentHTML("beforeend", "<div id='clickhint' style='margin-top:8px;font-weight:700'>Maintenant, clique toi-même sur la partie qui clignote pour continuer.</div>");
}

function renderEnd() {
  const s = R.s;
  crumbs(s.title);
  const pct = R.total ? R.first / R.total : 0;
  const msg = pct === 1 ? "Parfait, tout juste du premier coup !" : pct >= 0.8 ? "Excellent travail !" : pct >= 0.5 ? "Bien joué, continue !" : "Courage : c'est en se trompant qu'on apprend.";
  const p100 = Math.round(100 * pct);
  const verdict = p100 >= AVG ? "<span style='color:var(--ok)'>Au-dessus de " + AVG + " % : niveau CEB atteint.</span>" : p100 >= PASS ? "<span style='color:var(--warn)'>Au-dessus de " + PASS + " %, mais vise " + AVG + " % pour la moyenne.</span>" : "<span style='color:var(--bad)'>Sous " + PASS + " % : revois la méthode et refais une manche.</span>";
  let html = "<div class='card end'><h2>Manche terminée</h2><div class='big'>" + p100 + " %</div><p>" + R.first + " / " + R.total + " justes du premier coup. " + verdict + "<br>" + msg + "</p>";
  if (R.wrongItems.length) {
    html += "<p><b>À revoir :</b></p><ul>" + R.wrongItems.map(c => "<li>" + reviewLine(c) + "</li>").join("") + "</ul>";
  }
  html += "<div class='btns'><button class='primary' id='again'>Nouvelle manche</button><button id='tosub'>Choisir un autre thème</button></div></div>";
  app.innerHTML = html;
  $("#again").onclick = () => startRound(s, R.themes, R.size);
  $("#tosub").onclick = () => go({ name: "subject", subject: s.id });
}

function reviewLine(c) {
  const t = c.t, i = c.i;
  if (t.type === "facts") return "<b>" + esc(t.items[i][0]) + "</b> : " + esc(t.items[i][1]);
  if (t.type === "qcm") return esc(t.items[i].q) + " <b>" + esc(t.items[i].a) + "</b>";
  if (t.type === "diagram") return "<b>" + esc(t.regions[i][1]) + "</b> : " + esc(t.regions[i][2]);
  if (t.type === "events") return "<b>" + esc(t.items[i][1]) + "</b> : " + esc(t.items[i][0]);
  if (t.type === "gen") return c.snap || "";
  if (t.type === "order") return "Une frise à refaire (relis la fiche de la frise)";
  if (t.type === "century") return "Le calcul des siècles (relis la règle dans la fiche)";
  if (i < t.words.length) { const w = t.words[i]; return "<b>" + esc(w[0]) + "</b> : " + esc(t.suffixes[w[2]][1].replace("{o}", t.organs[w[1]][1]).toLowerCase()); }
  const sp = t.special[i - t.words.length]; return "<b>" + esc(sp.w) + "</b> : " + esc(sp.a.toLowerCase());
}

// ---------- clavier ----------
document.addEventListener("keydown", ev => {
  if (view.name !== "play" || !R || !R.q) return;
  if (!R.locked && R.q.kind === "input" && ev.key === "Enter") { ev.preventDefault(); answerInput(); return; }
  if (!R.locked && R.q.kind === "qcm" && /^[1-4]$/.test(ev.key) && R.q.options.length >= +ev.key) answerQcm(+ev.key - 1);
  else if (R.locked && !R.mustClick && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); nextQuestion(); }
});

// ---------- schémas ----------
const DIAGRAMS = {
  cerveau(labels) {
    // Cerveau vu de côté, l'avant à gauche. Les lobes sont des polygones découpés par le contour du cerveau.
    const outline = "M 78 196 C 58 120, 120 48, 232 38 C 334 28, 432 48, 492 108 C 532 150, 534 214, 504 246 C 476 268, 430 268, 392 262 C 352 292, 262 306, 206 288 C 160 274, 118 252, 98 236 C 86 226, 80 212, 78 196 Z";
    const lobes = [
      ["frontal", "#f7c9a8", "0,0 305,0 258,205 150,238 100,400 0,400"],
      ["parietal", "#c9dcf5", "305,0 445,0 440,182 258,205"],
      ["occipital", "#d7c9f2", "445,0 640,0 640,400 430,400 440,182"],
      ["temporal", "#c8ebc6", "150,238 258,205 440,182 430,400 100,400"]
    ];
    let s = "<svg class='diagram' viewBox='40 20 540 380' xmlns='http://www.w3.org/2000/svg'>";
    s += "<defs><clipPath id='cb'><path d='" + outline + "'/></clipPath></defs>";
    // moelle et tronc (derrière)
    s += "<path class='r' data-r='moelle' fill='#f3e3b0' d='M 330 352 L 360 352 L 358 400 L 334 400 Z'/>";
    s += "<path class='r' data-r='tronc' fill='#f2d38b' d='M 312 262 C 330 258, 362 258, 378 264 L 372 318 C 368 336, 362 348, 360 354 L 330 354 C 326 340, 320 326, 318 312 Z'/>";
    // cervelet
    s += "<path class='r' data-r='cervelet' fill='#f4b6c2' d='M 372 270 C 400 252, 470 250, 506 262 C 530 272, 528 304, 500 318 C 466 334, 410 330, 382 316 C 366 306, 362 282, 372 270 Z'/>";
    s += "<path class='deco' d='M 388 284 C 420 276, 470 276, 512 286 M 384 298 C 420 292, 470 294, 506 302 M 392 311 C 424 308, 462 310, 492 314'/>";
    // lobes
    s += "<g clip-path='url(#cb)'>" + lobes.map(l => "<polygon class='r' data-r='" + l[0] + "' fill='" + l[1] + "' points='" + l[2] + "'/>").join("") + "</g>";
    s += "<path d='" + outline + "' fill='none' stroke='#7d6a5a' stroke-width='2.5' pointer-events='none'/>";
    // quelques plis (décor)
    s += "<path class='deco' d='M 130 120 C 160 100, 190 130, 220 110 M 120 170 C 160 150, 200 180, 235 160 M 330 80 C 360 70, 380 100, 410 90 M 335 140 C 360 125, 390 150, 420 135 M 220 260 C 260 245, 300 265, 340 245 M 465 120 C 480 150, 470 190, 488 215 M 180 70 C 200 85, 230 70, 260 80'/>";
    if (labels) {
      const L = [["Lobe frontal", 120, 150], ["Lobe pariétal", 320, 110], ["Lobe occipital", 445, 165], ["Lobe temporal", 250, 255], ["Cervelet", 410, 300], ["Tronc cérébral", 172, 318], ["Moelle épinière", 370, 385]];
      s += L.map(l => "<text x='" + l[1] + "' y='" + l[2] + "'>" + l[0] + "</text>").join("");
      s += "<path d='M 296 313 L 322 300 M 362 382 L 352 382' stroke='#1f2933' stroke-width='1.5' pointer-events='none'/>";
    }
    return s + "</svg>";
  }
};

render();
</script>
